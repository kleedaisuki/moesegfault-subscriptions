[package]
name = "billing"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["worker-entry"]
worker-entry = []

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.34"
getrandom = { version = "=0.2.17", features = ["js"] }
hmac = "0.12.1"
js-sys = "=0.3.105"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "2.6.1"
url = "2.5.7"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = ["Crypto", "CryptoKey", "RsaHashedImportParams", "SubtleCrypto"] }
worker = { version = "=0.8.6", features = ["d1"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
