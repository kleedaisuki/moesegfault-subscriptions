name: Staging delivery

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'skills/**', '**/*.md']
  workflow_dispatch:
    inputs:
      delivery:
        description: Verify artifact or deploy staging (never production)
        required: true
        type: choice
        default: verify-only
        options: [verify-only, staging-only]

permissions:
  contents: read

concurrency:
  group: subscriptions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24.8.0
  CARGO_BUILD_JOBS: 2

jobs:
  rust:
    name: Rust tests and WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust1.88-wb0.8.6-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust1.88-wb0.8.6-
      - name: Pinned tools
        run: |
          rustc --version
          command -v worker-build >/dev/null || cargo install worker-build --version 0.8.6 --locked
      - name: Format and test domain contracts
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: Build billing and Subscribe sequentially
        run: |
          (cd crates/billing && worker-build --release)
          (cd crates/subscribe && worker-build --release)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workers-${{ github.sha }}
          path: |
            crates/billing/build/
            crates/subscribe/build/
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend and deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm}
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Focused validation
        run: |
          npm run typecheck
          npm test
          npm run test:deployment
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python scripts/admin-migration.test.py
          npm audit --audit-level=high
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-${{ github.sha }}
          path: apps/subscribe/dist/
          retention-days: 7
          if-no-files-found: error

  package:
    name: Immutable staging package
    needs: [rust, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm}
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'workers-${{ github.sha }}', path: crates}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'frontend-${{ github.sha }}', path: apps/subscribe/dist}
      - run: npm run package:billing && npm run package:subscribe
      - name: Pack verified outputs, never credentials
        run: |
          mkdir -p .temp/release
          tar -czf .temp/release/staging.tar.gz crates/billing/build crates/subscribe/build apps/subscribe/dist
          (cd .temp/release && sha256sum staging.tar.gz > staging.tar.gz.sha256)
          printf '%s\n' '${{ github.sha }}' > .temp/release/source-revision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-${{ github.sha }}
          path: .temp/release/
          retention-days: 14
          if-no-files-found: error

  staging:
    name: Deploy staging
    needs: package
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.delivery == 'staging-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: cloudflare-staging
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '${{ env.NODE_VERSION }}', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: 'staging-${{ github.sha }}', path: .temp/release}
      - name: Verify then deploy without rebuilding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure cloudflare-staging CLOUDFLARE_API_TOKEN'; exit 1; }
          (cd .temp/release && sha256sum -c staging.tar.gz.sha256)
          test "$(cat .temp/release/source-revision.txt)" = '${{ github.sha }}'
          tar -xzf .temp/release/staging.tar.gz
          npm run deploy:staging
